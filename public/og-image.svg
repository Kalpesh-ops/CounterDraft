<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f8f6f0" />
  <!-- Outer Editorial Borders -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1a1a18" stroke-width="2" />
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#d5d0c3" stroke-width="1" />

  <!-- Scales of Justice Emblem -->
  <g transform="translate(100, 160)">
    <!-- Central Pillar & Base -->
    <line x1="80" y1="20" x2="80" y2="240" stroke="#1a1a18" stroke-width="6" stroke-linecap="square" />
    <line x1="30" y1="240" x2="130" y2="240" stroke="#1a1a18" stroke-width="8" stroke-linecap="square" />
    <line x1="45" y1="225" x2="115" y2="225" stroke="#1a1a18" stroke-width="4" stroke-linecap="square" />
    <circle cx="80" cy="20" r="10" fill="#1a1a18" />
    <!-- Beam -->
    <line x1="10" y1="55" x2="150" y2="55" stroke="#1a1a18" stroke-width="6" stroke-linecap="square" />
    <!-- Left Pan -->
    <line x1="10" y1="55" x2="-15" y2="135" stroke="#4a4a44" stroke-width="2" />
    <line x1="10" y1="55" x2="35" y2="135" stroke="#4a4a44" stroke-width="2" />
    <path d="M -25 135 Q 10 160 45 135 Z" fill="#1a1a18" />
    <!-- Right Pan -->
    <line x1="150" y1="55" x2="125" y2="135" stroke="#4a4a44" stroke-width="2" />
    <line x1="150" y1="55" x2="175" y2="135" stroke="#4a4a44" stroke-width="2" />
    <path d="M 115 135 Q 150 160 185 135 Z" fill="#1a1a18" />
  </g>

  <!-- Typography & Masthead -->
  <g transform="translate(360, 150)">
    <text x="0" y="40" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#8b2500" letter-spacing="4">
      STATUTORY CLAUSE AUDIT &amp; CONTRACT COMPARATOR
    </text>

    <text x="0" y="115" font-family="'Newsreader', Georgia, serif" font-size="72" font-weight="600" fill="#1a1a18" letter-spacing="-1">
      CounterDraft
    </text>

    <text x="0" y="170" font-family="'IBM Plex Serif', serif" font-size="24" font-weight="400" fill="#4a4a44">
      Legal Intelligence &amp; Clause Negotiation Engine
    </text>

    <line x1="0" y1="205" x2="720" y2="205" stroke="#1a1a18" stroke-width="2" />

    <text x="0" y="245" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="400" fill="#1a1a18">
      Grounded in Indian Contract Act, 1872 &amp; Supreme Court Case Law
    </text>
    <text x="0" y="280" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#666660">
      Google Gemini GenAI • Verified Citations • Actionable Redlines
    </text>
  </g>

  <!-- Bottom Metadata Ledger Strip -->
  <rect x="34" y="540" width="1132" height="56" fill="#f0ede1" />
  <line x1="34" y1="540" x2="1166" y2="540" stroke="#1a1a18" stroke-width="1.5" />
  <text x="60" y="575" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#1a1a18" letter-spacing="2">
    INDEXED AUTHORITIES: PERCEPT D'MARK • KAILASH NATH • BROJO NATH GANGULY • NIRANJAN SHANKAR GOLIKARI
  </text>
</svg>
