name: Bug Report
description: Report a bug, parsing glitch, or unexpected behavior in CounterDraft
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in CounterDraft. Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "e.g. When pasting a lease agreement with section numbers formatted as 'Sec. 4(a)', the clause title is truncated."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Navigate to 'Ingest Custom Contract'
        2. Paste the provided sample text
        3. Click 'Ingest & Audit Contract'
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: sample-text
    attributes:
      label: Contract Text / Minimal Reproducible Sample
      description: Provide a sanitized, non-confidential snippet of the contract text that triggers the issue.
      render: text
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser Environment
      options:
        - Chrome / Chromium
        - Firefox
        - Safari / WebKit
        - Edge
        - Other (Mobile / Embedded)
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Security & Privacy Confirmation
      options:
        - label: I confirm that the sample contract text provided above does NOT contain real confidential or personally identifiable information.
          required: true
