name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Security & Unit Test Suite
        run: npm test

      - name: TypeScript Typecheck & Production Bundle Build
        run: npm run build

      - name: Archive Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: counterdraft-dist
          path: dist/
          retention-days: 7
